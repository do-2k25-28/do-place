services:
  redis:
    image: redis/redis-stack-server:7.4.0-v8
    command: redis-server /etc/redis/redis.conf
    network_mode: host
    volumes:
      - ./redis.conf:/etc/redis/redis.conf

  backend:
    image: denoland/deno:2.5.6
    depends_on:
      - redis
    network_mode: host
    working_dir: /app
    environment:
      - REDIS_HOST=127.0.0.1
      - REDIS_USER=doplace
      - REDIS_PASSWORD=to77eeBklb0fgA
      - FRONTEND_ORIGIN=http://localhost:8002
      - JWT_SECRET=NpKn6gLUMTfHt4hmHveDKRxibPK7fcP7
      - HASH_SECRET=TZtwd9j3AsQtai44jSyNDzbmfC8XETkz
      - ENABLE_HTTP_COMPRESSION=false
      - PORT=8000
      - CLUSTER=true
    command: ["deno", "run", "dev"]
    volumes:
      - ./backend:/app
      - ~/.cache/deno:/deno-dir # Speed up application start up by using the deno cache from the host

  backend-2:
    image: denoland/deno:2.5.6
    depends_on:
      - redis
    working_dir: /app
    network_mode: host
    environment:
      - REDIS_HOST=127.0.0.1
      - REDIS_USER=doplace
      - REDIS_PASSWORD=to77eeBklb0fgA
      - FRONTEND_ORIGIN=http://localhost:8003
      - JWT_SECRET=NpKn6gLUMTfHt4hmHveDKRxibPK7fcP7
      - HASH_SECRET=TZtwd9j3AsQtai44jSyNDzbmfC8XETkz
      - ENABLE_HTTP_COMPRESSION=false
      - CLUSTER=true
      - PORT=8001
    command: ["deno", "run", "dev"]
    volumes:
      - ./backend:/app
      - ~/.cache/deno:/deno-dir # Speed up application start up by using the deno cache from the host

  frontend:
    image: oven/bun:1.3-debian
    depends_on:
      - backend
    network_mode: host
    working_dir: /app
    environment:
      - VITE_BACKEND_URL=http://localhost:8000/api/v1
      - VITE_PORT=8002
    command: ["bun", "run", "dev"]
    volumes:
      - ./frontend:/app

  frontend-2:
    image: oven/bun:1.3-debian
    depends_on:
      - backend
    network_mode: host
    working_dir: /app
    environment:
      - VITE_BACKEND_URL=http://localhost:8001/api/v1
      - VITE_PORT=8003
    command: ["bun", "run", "dev"]
    volumes:
      - ./frontend:/app
